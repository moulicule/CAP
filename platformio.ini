[env:esp32-s3-zero]
; Arduino 2.0.17 avoids the measured eye-rendering regression in Arduino 3.3.12.
platform = espressif32 @ 6.12.0
board = esp32-s3-devkitc-1
framework = arduino

monitor_port = /dev/cu.usbmodem101
monitor_speed = 115200

board_build.mcu = esp32s3
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.partitions = default.csv
board_build.flash_mode = dio
board_build.arduino.memory_type = dio_qspi

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -DUSER_SETUP_LOADED
    -DGC9A01_DRIVER
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MOSI=11
    -DTFT_MISO=-1
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=9
    -DTFT_RST=8
    -DSPI_FREQUENCY=40000000
    -DENABLE_NOTHING_TEST_DEVICE=1

lib_deps =
    https://github.com/Bodmer/TFT_eSPI.git#16e37595040eac69cd628e4bffb56fc30cad6299
    h2zero/NimBLE-Arduino @ 2.5.2
